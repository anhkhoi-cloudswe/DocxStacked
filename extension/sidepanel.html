<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocxStacked</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 1. Top Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip-online {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .chip-offline {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 2. Exam Card */
    .exam-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .exam-title-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: #334155;
      color: #fff;
    }

    .thread-url-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .thread-url-input:focus {
      border-color: var(--primary);
    }

    /* Reopen Exam Banner */
    .reopen-banner {
      display: none;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 4px;
      padding: 8px;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }

    .reopen-title {
      font-weight: 600;
      color: #a5b4fc;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reopen-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .reopen-checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      margin-top: 2px;
    }

    /* 3. Primary Button */
    .btn-main {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-start {
      background: var(--primary);
      color: #fff;
    }

    .btn-start:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
    }

    .btn-stop:hover:not(:disabled) {
      background: #dc2626;
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 4. Progress Bar & Compact Subtitle */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .progress-subtitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Compact Stats Line */
    .stats-line {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 5. Result Card */
    .result-card {
      display: none;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius);
      padding: 10px 12px;
      flex-direction: column;
      gap: 8px;
    }

    .result-title {
      color: #34d399;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .result-btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 6px 10px;
      background: #334155;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-download {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .btn-download:hover {
      background: #059669;
    }

    /* 6. Accordion Details (Log & Advanced) */
    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 12px;
    }

    details summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      outline: none;
      user-select: none;
    }

    .log-box {
      margin-top: 6px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      height: 120px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-line {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      font-variant-numeric: tabular-nums;
    }

    .log-info { color: #93c5fd; }
    .log-success { color: #86efac; }
    .log-warn { color: #fde047; }
    .log-error { color: #fca5a5; }

    /* Notice Banner */
    .notice-box {
      display: none;
      padding: 6px 10px;
      border-radius: var(--radius);
      font-size: 12px;
      line-height: 1.4;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <!-- 1. Header: Short Title & Status Chip -->
  <div class="header">
    <span class="brand-title">DocxStacked</span>
    <span id="backend-status" class="status-chip chip-offline">Backend Offline</span>
  </div>

  <!-- Notification Banner -->
  <div id="ui-notice-box" class="notice-box"></div>

  <!-- 2. Exam Card: Truncated Title & Read from Tab Icon Button -->
  <div class="card">
    <div class="exam-header">
      <span id="thread-title-display" class="exam-title-text" title="Chưa chọn đề thi nào">
        Chưa chọn đề thi nào
      </span>
      <button id="btn-sync-tab" class="btn-icon" title="Đọc từ tab hiện tại">
        Đọc từ tab
      </button>
    </div>
    <input type="text" id="input-thread-url" class="thread-url-input" placeholder="https://fuoverflow.com/threads/..." />

    <!-- Reopen Card for already compiled exam -->
    <div id="reopen-card" class="reopen-banner">
      <div id="reopen-text" class="reopen-title">Đã soạn lúc --:-- (0 câu)</div>
      <div class="reopen-actions">
        <a id="btn-reopen-download" class="btn-secondary btn-download" href="#" target="_blank" style="flex: 1;">
          Tải file
        </a>
        <button id="btn-reopen-update" class="btn-secondary" style="flex: 1;">
          Cập nhật bình luận
        </button>
      </div>
      <label class="reopen-checkbox-label">
        <input type="checkbox" id="check-redownload-images" />
        <span>Tải lại cả ảnh</span>
      </label>
    </div>
  </div>

  <!-- 3. Action Controls: Single Primary Button & Progress Bar -->
  <div class="card">
    <button id="btn-main-action" class="btn-main btn-start">
      Bắt đầu soạn
    </button>

    <!-- Progress & Compact Subtitle -->
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <div class="progress-subtitle">
        <span id="progress-status">Sẵn sàng</span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <!-- Compact Stats Line -->
    <div id="stats-summary-line" class="stats-line">
      0/0 câu · 0 bình luận
    </div>

    <!-- Offline recovery / retry row -->
    <div id="offline-recovery-row" style="display: none; gap: 6px;">
      <button id="btn-retry-ingest" class="btn-secondary" style="flex: 2; font-size: 11px;">
        Gửi lại dữ liệu
      </button>
      <button id="btn-clear-idb" class="btn-secondary" style="flex: 1; font-size: 11px; color: #fca5a5;">
        Xoá
      </button>
    </div>
  </div>

  <!-- 4. Result Card -->
  <div id="result-card" class="result-card">
    <div id="result-filename" class="result-title">
      Xuất file Word thành công!
    </div>
    <div class="result-btn-row">
      <a id="result-download-btn" class="btn-secondary btn-download" href="#" target="_blank">
        Tải Word
      </a>
      <button id="btn-open-folder" class="btn-secondary">
        Mở thư mục
      </button>
    </div>
  </div>

  <!-- 5. Collapsible Log ("Chi tiết") -->
  <details id="details-logs">
    <summary>
      <span>Chi tiết</span>
      <button id="btn-copy-log" class="btn-icon" style="padding: 1px 4px; font-size: 10px;">Sao chép nhật ký</button>
    </summary>
    <div id="log-box" class="log-box">
      <div class="log-line log-info">[Khởi động] Sẵn sàng.</div>
    </div>
  </details>

  <!-- 6. Collapsible Advanced ("Nâng cao") -->
  <details id="details-advanced">
    <summary>
      <span>Nâng cao</span>
    </summary>
    <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 4px;">
      <label style="font-size: 11px; color: var(--muted);">Token thủ công (tuỳ chọn)</label>
      <input type="password" id="input-ingest-token" class="thread-url-input" placeholder="(Mặc định để trống)" />
    </div>
  </details>

  <script src="sidepanel.js"></script>
</body>
</html>
